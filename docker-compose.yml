# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: chat + redis (+ nginx nếu làm phần cộng điểm)
#
# Chạy toàn bộ stack:
#     docker compose up -d
#
# Scale chat lên 3 instance (qua nginx load balancer):
#     docker compose up -d --scale chat=3
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Đọc từ .env — KHÔNG viết giá trị thẳng vào đây
      API_TOKEN: ${API_TOKEN}
      # Trong compose, tên service chính là hostname — KHÔNG dùng localhost
      REDIS_URL: redis://redis:6379/0
      BUCKET_CAPACITY: ${BUCKET_CAPACITY:-10}
      REFILL_PER_MINUTE: ${REFILL_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ĐIỂM CỘNG: nginx load balancer
  # Bật bằng: docker compose up -d --scale chat=3
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat
    profiles:
      - nginx

volumes:
  redis-data:
